<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports - Credibility Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">Credibility Intelligence</a>
      
          <div class="navbar-nav ms-auto">
            <a class="nav-link nav-public" href="index.html">Home</a>
            <a class="nav-link nav-public" href="login.html">Login</a>
            <a class="nav-link nav-public" href="register.html">Register</a>
      
            <a class="nav-link nav-auth hidden" href="reports.html">Reports</a>
            <a class="nav-link nav-auth hidden" href="score.html">Score</a>
            <a class="nav-link nav-auth hidden" href="claims.html">Claims</a>
      
            <a class="nav-link nav-admin hidden" href="admin.html">Admin</a>
            <a class="nav-link logout-btn hidden" href="#">Logout</a>
          </div>
        </div>
    </nav>

  <div class="container py-5">
    <h1 class="page-title">My Reports</h1>
    <p class="small-note nav-username">Not logged in</p>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h4>Create a Report</h4>
        <form id="reportForm">
          <div class="mb-3">
            <label class="form-label">Statement Text</label>
            <textarea id="statement_text" class="form-control" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Speaker</label>
            <input id="speaker" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Reason</label>
            <textarea id="report_reason" class="form-control" required></textarea>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Risk Score</label>
              <input id="risk_score" type="number" class="form-control" value="50" />
            </div>

            <div class="col-md-4 mb-3">
              <label class="form-label">Risk Level</label>
              <select id="risk_level" class="form-select">
                <option value="low">low</option>
                <option value="medium" selected>medium</option>
                <option value="high">high</option>
                <option value="unknown">unknown</option>
              </select>
            </div>
          </div>
          <button type="submit" id="reportSubmitBtn" class="btn btn-success">Submit Report</button>
          <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden ms-2" onclick="cancelEdit()">Cancel</button>
        </form>

        <div id="reportsResult" class="mt-3"></div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h4>My Existing Reports</h4>
        <div id="myReportsList" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
