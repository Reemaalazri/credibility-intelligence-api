<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claims Explorer - Credibility Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">Credibility Intelligence</a>
      
          <div class="navbar-nav ms-auto">
            <a class="nav-link nav-public" href="index.html">Home</a>
            <a class="nav-link nav-public" href="login.html">Login</a>
            <a class="nav-link nav-public" href="register.html">Register</a>
      
            <a class="nav-link nav-auth hidden" href="reports.html">Reports</a>
            <a class="nav-link nav-auth hidden" href="score.html">Score</a>
            <a class="nav-link nav-auth hidden" href="index.html">Claims</a>
      
            <a class="nav-link nav-admin hidden" href="admin.html">Admin</a>
            <a class="nav-link logout-btn hidden" href="#">Logout</a>
          </div>
        </div>
    </nav>

  <div class="container py-5">
    <h1 class="page-title">Claims Explorer</h1>
    <p class="small-note nav-username">Not logged in</p>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form id="claimsForm" class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Search</label>
            <input id="search" class="form-control" placeholder="e.g. vaccine" />
          </div>

          <div class="col-md-3">
            <label class="form-label">Label</label>
            <select id="label" class="form-select">
              <option value="">All</option>
              <option value="true">true</option>
              <option value="mostly-true">mostly-true</option>
              <option value="half-true">half-true</option>
              <option value="barely-true">barely-true</option>
              <option value="false">false</option>
              <option value="pants-fire">pants-fire</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Ordering</label>
            <select id="ordering" class="form-select">
              <option value="">Default</option>
              <option value="speaker">speaker</option>
              <option value="-created_at">newest</option>
              <option value="label">label</option>
            </select>
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Load Claims</button>
          </div>

          <div class="col-md-8">
            <label class="form-label">By Speaker</label>
            <input id="speaker" class="form-control" placeholder="e.g. trump" />
          </div>

          <div class="col-md-4 d-flex align-items-end">
            <button type="button" id="bySpeakerBtn" class="btn btn-outline-secondary w-100">Search by Speaker</button>
          </div>
        </form>
      </div>
    </div>

    <div id="claimsResults"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/claims.js"></script>
</body>
</html>
