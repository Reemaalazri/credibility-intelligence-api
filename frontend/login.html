<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Credibility Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">Credibility Intelligence</a>
      
          <div class="navbar-nav ms-auto">
            <a class="nav-link nav-public" href="index.html">Home</a>
            <a class="nav-link nav-public" href="login.html">Login</a>
            <a class="nav-link nav-public" href="register.html">Register</a>
      
            <a class="nav-link nav-auth hidden" href="reports.html">Reports</a>
            <a class="nav-link nav-auth hidden" href="score.html">Score</a>
            <a class="nav-link nav-auth hidden" href="index.html">Claims</a>
      
            <a class="nav-link nav-admin hidden" href="admin.html">Admin</a>
            <a class="nav-link logout-btn hidden" href="#">Logout</a>
          </div>
        </div>
    </nav>

  <div class="container py-5" style="max-width: 600px;">
    <h1 class="page-title">Login</h1>
    <p class="small-note nav-username">Not logged in</p>

    <div class="card shadow-sm">
      <div class="card-body">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="username" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div id="loginResult" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      const response = await apiPost("/api/auth/token/", { username, password });
      const data = await response.json();

      if (!response.ok) {
        document.getElementById("loginResult").innerHTML =
          `<div class="alert alert-danger">${data.detail || "Login failed."}</div>`;
        return;
      }

      setTokens(data.access, data.refresh);
      setUsername(username);
    
      // temporary admin detection based on username
      // replace later with backend profile endpoint if needed
      setIsAdmin(username === "reema" || username === "adminuser");
      document.getElementById("loginResult").innerHTML =
        `<div class="alert alert-success">Login successful. Redirecting...</div>`;
      setTimeout(() => {
        window.location.href = "score.html";
      }, 1000);
    });
  </script>
</body>
</html>
