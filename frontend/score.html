<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score Claim - Credibility Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">Credibility Intelligence</a>
      
          <div class="navbar-nav ms-auto">
            <a class="nav-link nav-public" href="index.html">Home</a>
            <a class="nav-link nav-public" href="login.html">Login</a>
            <a class="nav-link nav-public" href="register.html">Register</a>
      
            <a class="nav-link nav-auth hidden" href="reports.html">Reports</a>
            <a class="nav-link nav-auth hidden" href="score.html">Score</a>
            <a class="nav-link nav-auth hidden" href="index.html">Claims</a>
      
            <a class="nav-link nav-admin hidden" href="admin.html">Admin</a>
            <a class="nav-link logout-btn hidden" href="#">Logout</a>
          </div>
        </div>
    </nav>

  <div class="container py-5">
    <h1 class="page-title">Check Claim Credibility</h1>
    <p class="small-note nav-username">Not logged in</p>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form id="scoreForm">
          <div class="mb-3">
            <label class="form-label">Enter claim text</label>
            <textarea id="claimText" class="form-control" rows="4" placeholder="e.g. vaccines cause autism"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Check Credibility</button>
        </form>
      </div>
    </div>

    <div id="scoreResult"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/score.js"></script>
</body>
</html>
