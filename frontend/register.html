<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Credibility Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">Credibility Intelligence</a>
      
          <div class="navbar-nav ms-auto">
            <a class="nav-link nav-public" href="index.html">Home</a>
            <a class="nav-link nav-public" href="login.html">Login</a>
            <a class="nav-link nav-public" href="register.html">Register</a>
      
            <a class="nav-link nav-auth hidden" href="reports.html">Reports</a>
            <a class="nav-link nav-auth hidden" href="score.html">Score</a>
            <a class="nav-link nav-auth hidden" href="index.html">Claims</a>
      
            <a class="nav-link nav-admin hidden" href="admin.html">Admin</a>
            <a class="nav-link logout-btn hidden" href="#">Logout</a>
          </div>
        </div>
    </nav>

  <div class="container py-5" style="max-width: 600px;">
    <h1 class="page-title">Register</h1>

    <div class="card shadow-sm">
      <div class="card-body">
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="username" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" type="email" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-success">Register</button>
        </form>

        <div id="registerResult" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value.trim()
      };

      const response = await apiPost("/api/auth/register/", payload);
      const data = await response.json();

      if (!response.ok) {
        document.getElementById("registerResult").innerHTML =
          `<div class="alert alert-danger">${prettyJSON(data)}</div>`;
        return;
      }

      document.getElementById("registerResult").innerHTML =
        `<div class="alert alert-success">Registration successful. You can now log in.</div>`;
      document.getElementById("registerForm").reset();
    });
  </script>
</body>
</html>
