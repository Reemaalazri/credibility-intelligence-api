services:
  - type: web
    name: credibility-intelligence-api
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn credibility_api.wsgi:application --chdir src"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: credibility-db
          property: connectionString

databases:
  - name: credibility-db
    plan: free